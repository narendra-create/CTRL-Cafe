<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve a seat – CTRL-CAFE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110d;--card:#1c1813;--card2:#221d16;--line:#2d271e;--tx:#f6f2e9;--mu:#9b9384;--y:#f5c518;--ink:#15110a}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:100px;-webkit-font-smoothing:antialiased}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--y);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.nav a{font-size:13px;font-weight:700;color:var(--y);text-decoration:underline;text-underline-offset:4px}
main{max-width:1040px;margin:auto;padding:0 20px}
h1{font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-1px;margin-top:16px}
h1 b{color:var(--y)}
.sub{color:var(--mu);font-size:15px;margin:8px 0 6px;max-width:36em;line-height:1.5}
.lbl{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:34px 0 12px;color:var(--tx)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px}
.tab{background:none;border:0;border-radius:13px;padding:14px 16px;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.tab b{display:block;font-size:17px;font-weight:600}
.tab small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.tab:hover{background:var(--card2)}
.tab.on{background:var(--y);color:var(--ink);box-shadow:0 6px 20px #f5c51822}
.tab.on small{color:#5b4a0c}
.info{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.info h3{font-size:22px;font-weight:700;margin:2px 0 4px}
.info p{font-size:13px;color:var(--mu)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tags span{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.price{text-align:right;color:var(--y);font-weight:700;font-size:26px;line-height:1}
.price small{display:block;font-size:10px;letter-spacing:.16em;color:var(--mu);margin-top:6px;font-weight:600}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--y);font-weight:700;text-transform:uppercase}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.seat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.seat svg{width:32px;height:32px;stroke:var(--mu);fill:none;stroke-width:1.6;margin-bottom:10px}
.seat b{display:block;font-size:15px;font-weight:600}
.seat small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.seat:hover{border-color:#5a4a1c}
.seat.sel{border-color:var(--y);background:#251f10}
.seat.sel svg{stroke:var(--y)}
.seat.bk{opacity:.4;cursor:not-allowed}.seat.bk:hover{border-color:var(--line)}
.step{display:none;align-items:center;justify-content:space-between;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.sel .step{display:flex}
.step button{width:28px;height:28px;border-radius:8px;border:0;background:var(--y);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
.step em{font-style:normal;font-size:12px;font-weight:600}
.hint{font-size:12px;color:var(--mu);margin-top:12px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:8px}
select,input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:13px 14px;font:inherit;font-size:14px;font-weight:500;color-scheme:dark}
select:focus,input:focus,.tab:focus-visible,.seat:focus-visible,button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#1c1813f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 20px}
.in{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.tot{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.line{font-size:12px;color:var(--mu);margin-top:2px}
.err{color:#ff8d7a}
.go{background:var(--y);color:var(--ink);border:0;border-radius:12px;padding:14px 24px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.go:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:720px){
 .tabs{grid-template-columns:1fr 1fr}.tab{padding:12px}
 .info{flex-direction:column}.price{text-align:left}
 .row{grid-template-columns:1fr 1fr}.row div:first-child{grid-column:1/-1}
 .go{padding:13px 18px}
}
</style>
</head>
<body>
<nav class="nav"><div class="brand"><div class="mark">C</div>CTRL-CAFE</div><a href="#">PLANS</a></nav>
<main>
 <h1>Reserve a seat<b>.</b></h1>
 <p class="sub">Pick a device, choose your seats and set your time. Each seat is a full unit, so bring the whole squad.</p>

 <div class="lbl">Choose your arena</div>
 <div class="tabs" id="tabs"></div>
 <div class="info" id="info"></div>

 <div class="lbl">Pick your seats</div>
 <div class="seats" id="seats"></div>
 <p class="hint" id="hint"></p>

 <div class="lbl">Date and time</div>
 <div class="row">
  <div><label for="date">Date</label><input type="date" id="date"></div>
  <div><label for="st">Start</label><select id="st"></select></div>
  <div><label for="en">End</label><select id="en"></select></div>
 </div>
 <p class="hint" id="hours"></p>
</main>

<div class="bar"><div class="in">
 <div><div class="tot" id="tot">₹0</div><div class="line" id="line">Pick a seat to start</div></div>
 <button class="go" id="go" disabled>Proceed to snacks</button>
</div></div>

<script>
// Placeholder data: replace prices, counts and taken seats with your real data / backend
const D={
 console:{n:'Console',s:'Big-screen battles',e:'Play together',d:'Grab a controller. Bring the rivalry.',t:['PS5','Xbox','Co-op','Sports'],c:5,p:50,m:4},
 pc:{n:'PC',s:'High FPS · Precision',e:'Play to win',d:'High refresh monitors and fast rigs.',t:['Valorant','CS2','GTA V'],c:6,p:80,m:2},
 arcade:{n:'Arcade',s:'Beat the high score',e:'Play together',d:'Classic cabinets, new rivalries.',t:['Racing','Fighting'],c:2,p:60,m:2},
 vr:{n:'VR',s:'Enter another world',e:'Play immersive',d:'Full-room VR. One headset per seat.',t:['Beat Saber','Horror','Sim'],c:1,p:150,m:2}
};
const B={console:[3],pc:[2,5],arcade:[],vr:[]};
const $=s=>document.querySelector(s);
let dev='console',sel={},slots=[];
const fmt=t=>{let[h,m]=t.split(':');h=+h;return(h%12||12)+':'+m+(h<12||h==24?' AM':' PM')};
$('#tabs').innerHTML=Object.entries(D).map(([k,v])=>`<button class="tab" data-k="${k}"><b>${v.n}</b><small>${v.s}</small></button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;dev=b.dataset.k;sel={};draw()};
$('#seats').onclick=e=>{
 const s=e.target.closest('.seat');if(!s||s.classList.contains('bk'))return;
 const i=+s.dataset.i,d=e.target.closest('[data-d]');
 if(d){sel[i]=Math.min(D[dev].m,Math.max(1,sel[i]+ +d.dataset.d))}
 else if(sel[i])delete sel[i];else sel[i]=1;
 draw()};
const today=new Date().toISOString().slice(0,10);$('#date').value=today;$('#date').min=today;
function buildSlots(){ // Mon-Fri 10-20, Sat-Sun 9-22 (from your footer)
 const wk=[0,6].includes(new Date($('#date').value+'T12:00').getDay()),o=wk?9:10,c=wk?22:20;
 slots=[];for(let h=o;h<=c;h++){slots.push(String(h).padStart(2,'0')+':00');if(h<c)slots.push(String(h).padStart(2,'0')+':30')}
 $('#st').innerHTML=slots.slice(0,-1).map(t=>`<option value="${t}">${fmt(t)}</option>`).join('');
 $('#en').innerHTML=slots.slice(1).map(t=>`<option value="${t}">${fmt(t)}</option>`).join('');
 $('#st').value='17:00';$('#en').value='19:00';
 $('#hours').textContent=`Open ${fmt(slots[0])} – ${fmt(slots[slots.length-1])} on this day.`}
$('#date').onchange=()=>{buildSlots();draw()};
['#st','#en'].forEach(x=>$(x).onchange=draw);
const hrs=()=>(slots.indexOf($('#en').value)-slots.indexOf($('#st').value))/2;
const ICON='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
function draw(){
 const v=D[dev],ids=Object.keys(sel),h=hrs();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===dev));
 $('#info').innerHTML=`<div><div class="eyebrow">${v.e}</div><h3>${v.n}</h3><p>${v.d}</p><div class="tags">${v.t.map(x=>`<span>${x}</span>`).join('')}</div></div><div class="price">₹${v.p}<small>/HOUR PER SEAT</small></div>`;
 $('#seats').innerHTML=Array.from({length:v.c},(_,j)=>{const i=j+1,bk=B[dev].includes(i),on=sel[i];
  return`<div class="seat ${bk?'bk':''} ${on?'sel':''}" data-i="${i}" tabindex="0">${ICON}<b>${v.n} ${i}</b><small>${bk?'Booked':'Up to '+v.m+' players'}</small>
  <div class="step"><button data-d="-1" aria-label="Fewer players">−</button><em>${on||0} player${on>1?'s':''}</em><button data-d="1" aria-label="More players">+</button></div></div>`}).join('');
 $('#hint').textContent=`${v.c-B[dev].length} of ${v.c} ${v.n} seats free. You book the whole unit, whatever the player count.`;
 const pl=ids.reduce((a,k)=>a+sel[k],0),ok=h>0&&ids.length>0;
 $('#tot').textContent='₹'+(ok?h*v.p*ids.length:0);
 const l=$('#line');l.classList.toggle('err',h<=0);
 l.textContent=h<=0?'End time must be after start time':ids.length?`${ids.length} seat${ids.length>1?'s':''} · ${pl} player${pl>1?'s':''} · ${h} hr`:'Pick a seat to start';
 $('#go').disabled=!ok;
}
$('#go').onclick=()=>{ // pass this to your snacks page / backend
 console.log({device:dev,seats:sel,date:$('#date').value,start:$('#st').value,end:$('#en').value});
 $('#line').textContent='Saved. Opening snacks…'};
buildSlots();draw();
</script>
</body>
</html>
